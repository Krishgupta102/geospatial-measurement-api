services:
  web:
    build: .
    container_name: geospatial_measurement_api
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Geospatial File Measurement API
      - DATABASE_URL=sqlite:///./geospatial.db
      - UPLOAD_DIR=./uploads
      - MAX_FILE_SIZE_BYTES=52428800
    volumes:
      - ./uploads:/app/uploads
      - ./geospatial.db:/app/geospatial.db
    restart: unless-stopped
